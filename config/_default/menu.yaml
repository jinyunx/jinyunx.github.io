# 需要时取消注释并改成自己的地址：
# social:
#   - identifier: github
#     name: GitHub
#     url: https://github.com/<你的用户名>
#     params:
#       icon: brand-github
#
#   - identifier: email
#     name: Email
#     url: mailto:you@example.com
#     params:
#       icon: mail

# 顶部导航菜单不在这里配置：
# 「关于」「归档」「搜索」等页面是在各自 md 文件的 front matter 里
# 通过 menu.main 声明的（见 content/page/*/index.md），
