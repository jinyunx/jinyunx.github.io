# ============================================================
# 主题参数（Stack）
# 完整可选项见 themes/hugo-theme-stack/config/_default/params.toml
# ============================================================

# 首页列表只展示 content/post/ 下的内容，
# 「关于」「归档」这类固定页（content/page/）不会混进文章流
mainSections:
  - post

# RSS 是否输出全文
# 加密方案下必须为 false：RSS 输出全文会绕过加密直接泄露正文，
# 且 RSS 阅读器无法执行解密 JS。加密文章在 RSS 里只有标题
rssFullContent: false

# 站点图标，放到 assets/img/favicon.png 后取消注释
# favicon: "img/favicon.png"

sidebar:
  # 没有头像图时显示的 emoji 占位
  emoji: "🌿"
  subtitle: "记录生活里那些值得回头看的瞬间"
  # 头像：把图片放到 assets/img/avatar.png 后取消下面这行
  # 路径相对 assets/ 目录，Hugo 会自动做多尺寸压缩
  # avatar: "img/avatar.png"

article:
  # 正文标题加锚点链接，方便分享到具体段落
  headingAnchor: true
  # 生活记录篇幅短，正文目录默认关掉；某篇很长时在该篇 front matter 里写 toc: true 单独开
  toc: false
  # 阅读时长（中文按 hasCJKLanguage 正确估算）
  readingTime: true
  math: false

  list:
    # 首页卡片上显示标签
    showTags: true

  license:
    # 生活记录多为个人内容，默认声明保留权利
    enabled: true
    default: "本文内容为个人生活记录，未经许可请勿转载"

# 侧边栏 / 页面小组件
widgets:
  homepage:
    - type: search
    - type: archives
      params:
        limit: 5
    - type: categories
      params:
        limit: 10
    - type: tag-cloud
      params:
        limit: 20
  page:
    - type: toc

# 日期显示格式，用 Go 时间格式（参考时间 2026-01-02 15:04:05）
dateFormat:
  published: "2026-01-02"
  lastUpdated: "2026-01-02"

# 浅色/深色模式
colorScheme:
  # 显示右上角切换按钮，访客仍可手动切回浅色（选择会记在浏览器 localStorage）
  toggle: true
  # 默认深色。可选值：auto（跟随系统）/ light / dark
  default: dark

# 图片处理：手机直出照片通常 3~5MB，Hugo 会自动生成多尺寸响应式图片
imageProcessing:
  # 按 EXIF 信息自动旋转，避免手机竖拍照片在网页里躺倒
  autoOrient: true
  content:
    enabled: true
    widths: [800, 1600, 2400]
  thumbnail:
    enabled: true

# ------------------------------------------------------------
# 评论：默认关闭。想开的话推荐 giscus（基于 GitHub Discussions，免费无广告）
# 步骤：
#   1. 打开 https://giscus.app ，按提示给博客仓库开启 Discussions 并安装 giscus App
#   2. 页面下方会生成 repo / repoID / category / categoryID 四个值，填到下面
#   3. 把 enabled 改成 true
# ------------------------------------------------------------
comments:
  enabled: false
  provider: giscus
  giscus:
    repo: ""
    repoID: ""
    category: "Announcements"
    categoryID: ""
    # 用文章标题关联评论区。若日后可能改标题，建议换成 pathname
    mapping: "title"
    lightTheme: "light"
    darkTheme: "dark_dimmed"
    reactionsEnabled: 1
    inputPosition: "top"
    lang: "zh-CN"
    loading: "lazy"

# ------------------------------------------------------------
# 文章加密 + 全站门禁
#   加密实现：scripts/encrypt-content.mjs
#             layouts/_partials/article/components/content.html
#   门禁实现：layouts/_partials/head/custom.html
#
# 加密方式：正文 AES-256-GCM，密钥由密码经 PBKDF2-SHA256
#          60 万次迭代派生。没有密码在数学上无法还原。
#
# 加密一篇文章：在其 front matter 加一行 encrypt: true
#
# 发布流程（务必按序，跳过第 1 步会发布出明文）：
#   BLOG_PASSWORD='你的密码' node scripts/encrypt-content.mjs
#   hugo --minify
# 或直接用 ./scripts/publish.sh "提交说明"（已封装且带自检）
#
# ⚠️ hint 里绝对不要写明文密码：
#   站点公开可访问，写了等于加密失效，且密码会永久留在 git 历史中。
#   这里只放「知情人能还原、陌生人拼不出」的提示。
# ------------------------------------------------------------
encrypt:
  # 全站门禁：打开任意页面先要求输入密码，通过后本次会话内
  # 浏览所有文章都不再询问（含加密文章正文自动解密）。
  # 校验方式是拿密码解密哨兵密文（data/gate.json），不是明文比对。
  gate: true
  gateTitle: "魔鬼小黑屋"
  gateHint: "输入密码进入"
  # 密码提示，门禁与文章解锁框都会展示（点「忘记密码了？」展开）
  hint: "四个词，please 的缩写 + 心情 + 今天 + 年月，全小写用连字符连起来。"

footer:
  # 页脚版权起始年份
  since: 2026
  customText: ""

# ------------------------------------------------------------
# 背景音乐（右下角悬浮按钮，实现见 layouts/_partials/footer/custom.html）
#
# 为什么没有自动播放：
#   Chrome / Safari 的 Autoplay Policy 禁止未经用户手势触发的有声播放，
#   写 autoplay 属性会被浏览器静默拒绝，无法绕过。所以只能点击播放。
#
# 放音频文件：
#   1. 把 mp3 放到 assets/music/ 目录（如 assets/music/bgm.mp3）
#   2. file 填相对 assets/ 的路径，即 "music/bgm.mp3"
#   3. enable 改成 true
#
# 也可以用外链：把 file 留空，改填 url: "https://example.com/xxx.mp3"
# （外链需对方允许跨域访问，否则加载失败按钮会自动隐藏）
# ------------------------------------------------------------
music:
  enable: false
  # 相对 assets/ 目录的路径
  file: "music/bgm.mp3"
  # 外链地址（file 找不到文件时才用这个）
  url: ""
  # 鼠标悬停提示文字，建议写曲名
  title: "背景音乐"
  # 音量 0~1。背景音乐不该压过阅读，0.35 约为舒适的环境音量
  volume: 0.35
